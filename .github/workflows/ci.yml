name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt

      - name: Lint (syntax errors and undefined names only)
        run: flake8 . --select=E9,F63,F7,F82 --show-source

      - name: Unit tests - parsing (must pass)
        run: python -m unittest -v TEST_PARSING

      # TEST_SCANNING needs the `yq` binary (preinstalled on ubuntu-latest). TEST_GRAPH needs
      # the original author's local repos, so it cannot pass in CI and is not run.
      - name: Unit tests - scanning (informational)
        continue-on-error: true
        run: python -m unittest TEST_SCANNING

      - name: Forensics - verify hash chain of audit log
        run: python forensics.py --verify forensics.log

      - name: Upload forensics log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensics-log
          path: forensics.log

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt

      # Findings are reported (job summary + artifact) but do not fail the build:
      # the known bugs are documented in SQA-REPO.md. Add --strict to gate on new findings.
      - name: Fuzz 10 methods
        run: python fuzz.py --iterations 300 --seed ${{ github.run_number }}

      - name: Upload fuzz report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-report
          path: fuzz_output/
